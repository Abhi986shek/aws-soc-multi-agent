[project]
name = "soc-agent"
version = "0.2.0"
description = "SOC multi-agent pipeline for AWS CloudTrail."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "strands-agents>=0.1.0",
    "strands-agents-tools>=0.1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "boto3>=1.34",
    "aioboto3>=13.0",
    "redis>=5.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "moto[dynamodb,sqs]>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Disable cache + benchmark plugin so no .pytest_cache/ or .benchmarks/ is written.
addopts = "-p no:cacheprovider -p no:benchmark -p no:codspeed"

[tool.ruff]
line-length = 100
